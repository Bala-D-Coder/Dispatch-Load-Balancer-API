spring:
  application:
    name: dispatch-load-balancer-api
  docker:
    compose:
      enabled: false
  # A local .env is loaded as a properties file — no dotenv dependency needed. 'optional:' keeps a
  # fresh clone bootable without one, and imported file values rank BELOW OS environment variables
  # and -D system properties, so deployment env always wins over a stale local file.
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  pattern:
    # Boot's default console shape plus the per-request id that RequestLoggingFilter puts in the MDC.
    # Render shows one flat stream, so this is what ties a service phase line to the HTTP line the same
    # Postman call produced (and to the X-Request-Id that response carries back); '-' = no request.
    # Written with plain converters on purpose: the nested ${VAR:-default} tokens Boot uses internally
    # are resolved by its own logging system, and inside logging.pattern.console they degrade to
    # %PARSER_ERROR / stray characters.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] [%X{requestId:--}] %-40.40logger{39} : %m%n%wEx"

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
      path-mapping:
        health: healthz
  endpoint:
    health:
      show-details: never
