name: Build & Deploy Dispatch API to Render

# ---------------------------------------------------------------------------
# ONE BRANCH SHIPS: `deploy/production`. A push to it — a merged PR or a direct
# push, GitHub cannot tell them apart at the trigger — runs the full test suite
# first (verify job) and only then builds and deploys. `main` is a mirror branch
# that triggers nothing at all, and a push to a personal branch (Impl, local_me)
# triggers nothing either: GitHub only reads workflow files from the branch being
# pushed, and no trigger list names those branches.
#
# `deploy/staging` stays in the trigger list, unused until an environment exists
# for it — the branch-name-to-environment mapping below already handles it.
#
# STILL NOT CONFIGURED. Nothing can reach a server until someone:
#   1. adds the secrets listed below,
#   2. creates a Render web service that pulls the Docker image,
#   3. sets the repository variable DEPLOY_ENABLED to `true`.
# Until step 3, every job after verify reports `skipped`, so a merge to
# deploy/production is green-but-deploys-nothing instead of red at Docker login.
#
# Required secrets: DOCKER_USERNAME, DOCKER_PASSWORD (a Docker Hub *access
# token*), RENDER_API_KEY, RENDER_SERVICE_ID_{STAGING,PRODUCTION},
# RENDER_DEPLOY_HOOK_{STAGING,PRODUCTION}, DB_URL, DB_USERNAME, DB_PASSWORD.
# Required vars:    DEPLOY_ENABLED=true, HEALTHCHECK_URL (post-deploy probe and
#                   the Environment URL both read it).
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - 'deploy/staging'
      - 'deploy/production'
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # migration-guard looks up the last successful production run

concurrency:
  group: deploy-${{ github.ref_name }}
  # A deploy is not a test run. If a second merge lands while one is in flight —
  # or waiting for your approval on the production environment — queue it behind
  # the running one instead of killing a half-finished deployment.
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # The gate: the identical suite and coverage thresholds a developer
  # runs locally, on the commit that is about to become the image.
  # ---------------------------------------------------------------
  verify:
    name: Tests + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # 151 tests against real Postgres containers, then the JaCoCo rules bound
      # to `verify` in pom.xml. Red here means nothing later in this file runs.
      - name: Verify
        run: ./mvnw -B -ntp verify

  # ---------------------------------------------------------------
  # Determine environment from branch + read the DEPLOY_ENABLED switch
  # ---------------------------------------------------------------
  setup:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      env_tag: ${{ steps.resolve.outputs.env_tag }}
      enabled: ${{ steps.resolve.outputs.enabled }}
    steps:
      - name: Resolve target environment
        id: resolve
        run: |
          if [[ "${{ github.ref_name }}" == "deploy/production" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "env_tag=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "env_tag=staging" >> "$GITHUB_OUTPUT"
          fi
          ENABLED="${{ vars.DEPLOY_ENABLED }}"
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" = "true" ]; then
            echo "Deployment enabled for ${{ github.ref_name }}."
          else
            echo "::notice::vars.DEPLOY_ENABLED is '${ENABLED:-unset}' (needs the literal 'true'), so the image build and the Render call are both skipped. Tests still ran."
          fi

  # ---------------------------------------------------------------
  # Production only: block migrations the prod DB would reject
  # (out-of-order versions, edited or renamed shipped migrations)
  # ---------------------------------------------------------------
  migration-guard:
    name: Validate DB Migrations (production)
    runs-on: ubuntu-latest
    needs: [setup, verify]
    if: needs.verify.result == 'success' && needs.setup.outputs.enabled == 'true' && needs.setup.outputs.environment == 'production'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve last successful production deploy
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE=$(gh run list --repo "${{ github.repository }}" --workflow deploy.yml \
            --branch deploy/production --status success --limit 1 \
            --json headSha --jq '.[0].headSha // empty' || true)
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$BEFORE_SHA"
            if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE=$(git rev-parse HEAD^1)
            fi
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: Check migration order against production
        run: bash .github/scripts/check-migration-order.sh "${{ steps.base.outputs.sha }}" HEAD

  # ---------------------------------------------------------------
  # Build Docker image and push to Docker Hub
  # ---------------------------------------------------------------
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [setup, verify, migration-guard]
    # verify must be green — an image is never built from code that failed the
    # suite. migration-guard is skipped for staging; it must pass for production.
    if: >-
      always() && needs.setup.result == 'success' &&
      needs.verify.result == 'success' &&
      needs.setup.outputs.enabled == 'true' &&
      (needs.migration-guard.result == 'success' || needs.migration-guard.result == 'skipped')
    timeout-minutes: 45
    # No `environment:` here on purpose: the approval gate sits on the job that
    # touches the live service. Declaring it on both jobs would prompt you twice.

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        id: docker-login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Check Docker login result
        if: steps.docker-login.outcome == 'failure'
        run: |
          echo "Docker login failed!"
          echo ""
          echo "Common issues:"
          echo "1. DOCKER_PASSWORD must be an ACCESS TOKEN (not your password)"
          echo "2. Check if the token has expired"
          echo "3. Verify the token has Read, Write, Delete permissions"
          echo "4. Verify DOCKER_USERNAME matches the Docker Hub account"
          exit 1

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/dispatch-load-balancer-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.setup.outputs.env_tag }}
            type=sha,prefix=${{ needs.setup.outputs.env_tag }}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ENV=${{ needs.setup.outputs.env_tag }}
            APP_VERSION=${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/dispatch-load-balancer-api:buildcache-${{ needs.setup.outputs.env_tag }}
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/dispatch-load-balancer-api:buildcache-${{ needs.setup.outputs.env_tag }},mode=max
          provenance: false

      - name: Verify image was pushed
        run: |
          echo "Dispatch Load Balancer image built and pushed successfully"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ---------------------------------------------------------------
  # Sync env vars to Render and trigger redeployment
  # ---------------------------------------------------------------
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: [setup, verify, build-and-push]
    timeout-minutes: 15
    # The approval gate: with "Required reviewers" on the production environment,
    # this job waits until you approve it, and the health URL shows on the run page.
    environment:
      name: ${{ needs.setup.outputs.environment }}
      url: ${{ vars.HEALTHCHECK_URL }}

    steps:
      - name: Resolve Render service ID and deploy hook
        id: render
        run: |
          if [[ "${{ needs.setup.outputs.env_tag }}" == "production" ]]; then
            echo "service_id=${{ secrets.RENDER_SERVICE_ID_PRODUCTION }}" >> "$GITHUB_OUTPUT"
            echo "deploy_hook=${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}" >> "$GITHUB_OUTPUT"
          else
            echo "service_id=${{ secrets.RENDER_SERVICE_ID_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "deploy_hook=${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}" >> "$GITHUB_OUTPUT"
          fi

      # These are the only four values the application reads. application.yaml
      # resolves DB_URL / DB_USERNAME / DB_PASSWORD (with localhost dev defaults),
      # and PORT is what the Dockerfile forwards to server.port. OS environment
      # variables outrank the optional .env import by design, so this is the
      # authoritative source of config in a deployed container.
      - name: Sync env vars to Render
        env:
          IN_DB_URL: ${{ secrets.DB_URL }}
          IN_DB_USERNAME: ${{ secrets.DB_USERNAME }}
          IN_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.render.outputs.service_id }}
        run: |
          # Secret values travel as environment variables, never interpolated into
          # the script text: a password containing a quote would otherwise break the
          # heredoc, and ${GITHUB_OUTPUT}-style interpolation leaves the value in logs.
          PAYLOAD=$(python3 - <<'PYEOF'
          import json, os
          envs = [
              {"key": "PORT",        "value": "8080"},
              {"key": "DB_URL",      "value": os.environ["IN_DB_URL"]},
              {"key": "DB_USERNAME", "value": os.environ["IN_DB_USERNAME"]},
              {"key": "DB_PASSWORD", "value": os.environ["IN_DB_PASSWORD"]},
          ]
          print(json.dumps(envs))
          PYEOF
          )

          HTTP_STATUS=$(curl --silent --show-error --output /tmp/render_env_response.txt --write-out "%{http_code}" \
            --request PUT \
            --url "https://api.render.com/v1/services/$SERVICE_ID/env-vars" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --connect-timeout 10 \
            --max-time 30)

          echo "Env sync HTTP Status: $HTTP_STATUS"
          cat /tmp/render_env_response.txt
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Env vars synced to Render."
          else
            echo "Failed to sync env vars (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Trigger Render deploy hook
        run: |
          HTTP_STATUS=$(curl --silent --show-error --output /tmp/render_deploy_response.txt --write-out "%{http_code}" \
            --request POST \
            --url "${{ steps.render.outputs.deploy_hook }}" \
            --connect-timeout 10 \
            --max-time 30)

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/render_deploy_response.txt
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render deployment triggered for ${{ needs.setup.outputs.env_tag }}."
          else
            echo "Render deploy hook failed with HTTP $HTTP_STATUS"
            exit 1
          fi

      # A 2xx from the deploy hook only means "queued". Poll until live, then
      # confirm the app actually booted — a Flyway or datasource failure
      # crash-loops the container and would otherwise look like success.
      - name: Wait for Render deployment
        run: |
          SERVICE_ID="${{ steps.render.outputs.service_id }}"

          DEPLOY_ID=$(python3 -c "
          import json
          try:
              data = json.load(open('/tmp/render_deploy_response.txt'))
              print(data.get('id', ''))
          except:
              print('')
          " 2>/dev/null || true)

          if [ -z "$DEPLOY_ID" ]; then
            echo "::warning::No deploy ID in response; sleeping 90s then skipping status polling."
            sleep 90
            exit 0
          fi

          for i in $(seq 1 60); do
            STATUS=$(curl -s --max-time 15 \
              --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || true)
            echo "[$i] Render deploy $DEPLOY_ID: ${STATUS:-unknown}"
            case "$STATUS" in
              live)                                               exit 0 ;;
              deactivated|build_failed|update_failed|canceled)   echo "::error::Render deployment $STATUS"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Render deployment"
          exit 1

      - name: Verify application health
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "::warning::vars.HEALTHCHECK_URL is not set, so the post-deploy probe is skipped."
            echo "::warning::Set it to https://<your-render-service>/healthz before trusting this workflow."
            exit 0
          fi

          # No hard-coded host: the service URL belongs in repository variables,
          # not in a workflow file that would then be wrong for every other deploy.
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" --max-time 10 "$HEALTHCHECK_URL" || true)
            echo "[$i] $HEALTHCHECK_URL -> $CODE $(cat /tmp/health.txt 2>/dev/null)"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::App is not healthy after deploy. Check Render service logs (Flyway / startup errors)."
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo ""
          echo "================================"
          echo " Deployment Complete"
          echo "================================"
          echo " Environment : ${{ needs.setup.outputs.env_tag }}"
          echo " Image       : ${{ secrets.DOCKER_USERNAME }}/dispatch-load-balancer-api:${{ needs.setup.outputs.env_tag }}"
          echo " Commit SHA  : ${{ github.sha }}"
          if [ -n "${{ vars.APP_URL }}" ]; then
            echo " URL         : ${{ vars.APP_URL }}"
          fi
          echo "================================"
